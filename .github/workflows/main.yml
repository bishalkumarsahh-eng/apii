name: MAGMA Music API

on:
  workflow_dispatch:

jobs:
  run-api:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl git unzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check app.py
        run: |
          set -e
          test -f app.py
          python -m py_compile app.py
          echo "✅ app.py syntax check passed."

      - name: Start FastAPI
        env:
          DOWNLOAD_WORKERS: "3"
          APP_HOST: "0.0.0.0"
          APP_PORT: "8000"
          PORT: "8000"
        run: |
          set -e
          nohup python app.py > api.log 2>&1 &
          API_PID=$!
          echo "$API_PID" > api.pid

          sleep 8

          if ! kill -0 "$API_PID" 2>/dev/null; then
            echo "❌ FastAPI failed to start!"
            cat api.log
            exit 1
          fi

          echo "✅ FastAPI started. PID: $API_PID"

      - name: Verify API
        run: |
          set -e
          sleep 3
          if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
            echo "✅ API is responding on port 8000."
          else
            echo "⚠️ Root endpoint did not respond."
            cat api.log
            exit 1
          fi

      - name: Keep API Running
        run: |
          echo "======================================"
          echo "       MAGMA API IS RUNNING"
          echo "       Docker-ready / no tunnel"
          echo "======================================"

          START=$(date +%s)

          while true; do
            if [ -f api.pid ]; then
              API_PID=$(cat api.pid)
              if ! kill -0 "$API_PID" 2>/dev/null; then
                echo "❌ FastAPI process stopped!"
                cat api.log
                exit 1
              fi
            fi

            NOW=$(date +%s)
            ELAPSED=$((NOW - START))
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] FastAPI=OK | Running=${ELAPSED}s"
            sleep 60
          done

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping API..."
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

          echo "========== FINAL API LOG =========="
          if [ -f api.log ]; then
            tail -100 api.log || true
          fi
